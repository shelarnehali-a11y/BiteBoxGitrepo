<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BiteBox-Registration</title>
</head>

<body>
    <main>

        <div>
            <div>
                <h1>Welcome To BiteBox</h1>
            </div>
            <form>

                <div>
                    <label>Name : </label>
                    <input type="text" placeholder="Enter your Name" required>
                    <br><br>
                    <label>Email : </label>
                    <input type="email" placeholder="Enter Email" required>

                </div>
                <br><br>
                <div>
                    <label>Password : </label>
                    <input type="password" placeholder="Enter password" required>
                    <br><br>
                    <label>Conformed Passwod </label>
                    <input type="password" placeholder="Conformed password" required>
                </div>
                <br><br>

                <div>
                    <label>Age : </label>
                    <input type="number" placeholder="Enter your Age" required>
                    <br><br>
                    <div>
                    <label>Select Gender </label>
                    <input type="radio" value="male" ><label>Male</label>
                    <input type="radio" value="female" ><label>female</label>
                    </div>
                    <br><br>
                    <div>
                    <label>DOB : </label>
                    <input type="date" placeholder="Enter DOB" required>
                    </div>
                    <br><br>
                    <label>Address : </label>
                    <input type="text" placeholder="Enter Address">
                    <br><br>
                    <label>Phone No : </label>
                    <input type="number" placeholder="Enter Phone No" >
                    <br><br>
                    <a href="./Login.html"><button>Register</button></a>
            </form>
        </div>
    </main>
</body>

</html>
